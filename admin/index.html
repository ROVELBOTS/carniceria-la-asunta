<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Carnicería La Asunta</title>
    <!-- Carga Netlify CMS -->
    <script src="https://unpkg.com/netlify-cms@^2.10.0/dist/netlify-cms.js"></script>
    <style>
        body {
            background: #FDF8F0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .cargando {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #F5E6D3;
            border-top: 4px solid #C0392B;
            border-radius: 50%;
            margin: 20px auto;
            animation: girar 1s linear infinite;
        }
        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .icono { font-size: 3rem; }
        .error { color: #C0392B; }
    </style>
</head>
<body>
    <div id="cargando" class="cargando">
        <div class="icono">🥩</div>
        <div class="spinner"></div>
        <h2>Cargando panel...</h2>
        <p>Conectando con el CMS</p>
    </div>

    <script>
        console.log('🥩 Panel de Administración - Carnicería La Asunta');

        // Ocultar carga cuando el CMS esté listo
        const observer = new MutationObserver(function() {
            if (document.querySelector('#nc-root')) {
                const loading = document.getElementById('cargando');
                if (loading) loading.style.display = 'none';
                observer.disconnect();
                console.log('✅ CMS cargado correctamente');
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // Timeout de seguridad
        setTimeout(() => {
            const loading = document.getElementById('cargando');
            if (loading && loading.style.display !== 'none') {
                loading.innerHTML = `
                    <div class="icono">⚠️</div>
                    <h2 class="error">Error al cargar</h2>
                    <p>No se pudo inicializar el CMS.</p>
                    <p style="font-size:0.85rem;color:#666;">
                        Verifica tu conexión a Internet y que Git Gateway esté activo.
                    </p>
                    <button onclick="location.reload()" style="
                        background:#C0392B;
                        color:white;
                        border:none;
                        padding:10px 24px;
                        border-radius:8px;
                        cursor:pointer;
                        margin-top:12px;
                        font-weight:600;
                    ">
                        Recargar
                    </button>
                `;
            }
        }, 15000);
    </script>
</body>
</html>
