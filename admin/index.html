<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Carnicería La Asunta</title>
    
    <!-- ============================================
         ESTILOS PARA LA PANTALLA DE CARGA
         ============================================ -->
    <style>
        body {
            background: #FDF8F0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .cargando {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #F5E6D3;
            border-top: 4px solid #C0392B;
            border-radius: 50%;
            margin: 20px auto;
            animation: girar 1s linear infinite;
        }
        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .icono { font-size: 3rem; }
        .error { color: #C0392B; }
        
        /* ============================================
           ESTILO PARA EL CONTENEDOR DEL CMS
           ============================================ */
        #nc-root {
            width: 100%;
            min-height: 100vh;
            background: #FDF8F0;
        }
    </style>
</head>
<body>
    <!-- ============================================
         CONTENEDOR DONDE SE RENDERIZARÁ EL CMS
         ============================================ -->
    <div id="nc-root"></div>

    <!-- ============================================
         PANTALLA DE CARGA (se oculta automáticamente)
         ============================================ -->
    <div id="cargando" class="cargando" style="
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        ">
        <div class="icono">🥩</div>
        <div class="spinner"></div>
        <h2>Cargando panel...</h2>
        <p>Conectando con el CMS</p>
    </div>

    <!-- ============================================
         CARGA DE NETLIFY CMS
         ============================================ -->
    <script src="https://unpkg.com/netlify-cms@^2.10.0/dist/netlify-cms.js"></script>

    <script>
        console.log('🥩 Panel de Administración - Carnicería La Asunta');

        // ============================================
        // FUNCIÓN PARA OCULTAR LA PANTALLA DE CARGA
        // ============================================
        function ocultarCarga() {
            const loading = document.getElementById('cargando');
            if (loading) {
                loading.style.opacity = '0';
                loading.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 500);
                console.log('✅ CMS cargado correctamente');
            }
        }

        // ============================================
        // OBSERVAR EL DOM PARA DETECTAR QUE EL CMS SE RENDERIZÓ
        // ============================================
        const observer = new MutationObserver(function() {
            // Buscar el contenedor principal del CMS (se llena cuando el CMS renderiza)
            const ncRoot = document.querySelector('#nc-root');
            if (ncRoot && ncRoot.children.length > 0) {
                ocultarCarga();
                observer.disconnect();
                return;
            }

            // También buscar el menú de colecciones (otra señal)
            const collections = document.querySelector('.nc-collection-list');
            if (collections) {
                ocultarCarga();
                observer.disconnect();
                return;
            }
        });

        // Iniciar la observación
        observer.observe(document.body, { childList: true, subtree: true });

        // ============================================
        // MECANISMO DE REINTENTO (FALLBACK)
        // ============================================
        // Si después de 8 segundos no se detecta el CMS, mostrar error
        setTimeout(() => {
            const loading = document.getElementById('cargando');
            if (loading && loading.style.display !== 'none') {
                loading.innerHTML = `
                    <div class="icono">⚠️</div>
                    <h2 class="error">Error al cargar</h2>
                    <p>No se pudo inicializar el CMS.</p>
                    <p style="font-size:0.85rem;color:#666; margin-top: 8px;">
                        Verifica tu conexión a Internet y que Git Gateway esté activo.
                    </p>
                    <button onclick="location.reload()" style="
                        background:#C0392B;
                        color:white;
                        border:none;
                        padding:10px 24px;
                        border-radius:8px;
                        cursor:pointer;
                        margin-top:12px;
                        font-weight:600;
                    ">
                        Recargar
                    </button>
                `;
            }
        }, 8000);
    </script>
</body>
</html>
