<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Carnicería La Asunta</title>
        <script src="https://unpkg.com/netlify-cms@^2.10.0/dist/netlify-cms.js"></script>
    <style>
        body {
            background: #FDF8F0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }
        .cargando {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #F5E6D3;
            border-top: 4px solid #C0392B;
            border-radius: 50%;
            margin: 20px auto;
            animation: girar 1s linear infinite;
        }
        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .icono { font-size: 3rem; }
        .error { color: #C0392B; }
    </style>
</head>
<body>
    <div id="cargando" class="cargando">
        <div class="icono">🥩</div>
        <div class="spinner"></div>
        <h2>Cargando panel...</h2>
        <p>Conectando con el CMS</p>
    </div>

    <script>
        console.log('🥩 Panel de Administración - Carnicería La Asunta');

        function ocultarCarga() {
            const loading = document.getElementById('cargando');
            if (loading) {
                loading.style.display = 'none';
                console.log('✅ CMS cargado correctamente');
            }
        }

        const observer = new MutationObserver(function(mutations) {
        
            const ncRoot = document.querySelector('#nc-root');
            if (ncRoot) {
                ocultarCarga();
                observer.disconnect();
                return;
            }

        
            const collections = document.querySelector('.nc-collection-list');
            if (collections) {
                ocultarCarga();
                observer.disconnect();
                return;
            }
        });

        
        observer.observe(document.body, { childList: true, subtree: true });

        
        
        const timeoutId = setTimeout(() => {
            
            if (document.querySelector('#nc-root') || document.querySelector('.nc-collection-list')) {
                ocultarCarga();
                observer.disconnect();
                return;
            }

            
            console.warn('⚠️ El CMS no se detectó automáticamente. Reintentando...');
            
            
            const oldScript = document.querySelector('script[src*="netlify-cms"]');
            if (oldScript) {
                oldScript.remove();
            }

            
            const newScript = document.createElement('script');
            newScript.src = 'https://unpkg.com/netlify-cms@^2.10.0/dist/netlify-cms.js';
            newScript.onload = function() {
                console.log('✅ Script de CMS recargado. Esperando inicialización...');
            
                setTimeout(() => {
                    if (document.querySelector('#nc-root')) {
                        ocultarCarga();
                        observer.disconnect();
                    }
                }, 3000);
            };
            document.head.appendChild(newScript);

            
            setTimeout(() => {
                const loading = document.getElementById('cargando');
                if (loading && loading.style.display !== 'none') {
                    loading.innerHTML = `
                        <div class="icono">⚠️</div>
                        <h2 class="error">Error al cargar</h2>
                        <p>No se pudo inicializar el CMS.</p>
                        <p style="font-size:0.85rem;color:#666;">
                            Verifica tu conexión a Internet y que Git Gateway esté activo.
                        </p>
                        <button onclick="location.reload()" style="
                            background:#C0392B;
                            color:white;
                            border:none;
                            padding:10px 24px;
                            border-radius:8px;
                            cursor:pointer;
                            margin-top:12px;
                            font-weight:600;
                        ">
                            Recargar
                        </button>
                    `;
                }
            }, 10000);
        }, 5000); 
    </script>
</body>
</html>
